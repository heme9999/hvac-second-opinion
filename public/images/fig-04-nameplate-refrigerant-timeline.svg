<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="fig04-title fig04-desc">
  <title id="fig04-title">Figure 04: Outdoor Condenser Data Plate Check and EPA R-22 / AIM Act Timeline</title>
  <desc id="fig04-desc">Diagram showing where to read MFR DATE and Refrigerant Type on an outdoor condenser data plate alongside the verified EPA 2010 R-22 equipment ban, January 1, 2020 R-22 production ban, and AIM Act R-454B/R-32 transition timeline.</desc>
  <rect width="820" height="330" fill="#FAF7F2" stroke="#1F2937" stroke-width="2" />
  <rect x="0" y="0" width="820" height="34" fill="#1F2937" />
  <text x="16" y="22" fill="#FAF7F2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">FIG 04 · CONDENSER DATA PLATE &amp; EPA REFRIGERANT TIMELINE</text>
  <text x="804" y="22" fill="#C2410C" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">CHECK C PROTOCOL</text>

  <!-- Data Plate Mockup -->
  <rect x="24" y="54" width="335" height="252" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="24" y="54" width="335" height="30" fill="#F2ECE1" stroke="#1F2937" stroke-width="1.5" />
  <text x="38" y="74" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">SAMPLE OUTDOOR UNIT RATING PLATE</text>

  <text x="38" y="108" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">MODEL NO:   AC36-09B-SAMPLE</text>
  <text x="38" y="130" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">SERIAL NO:  0809E44120</text>
  <rect x="34" y="144" width="315" height="34" fill="#FFF4ED" stroke="#C2410C" stroke-width="1.5" />
  <text x="44" y="166" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">MFR DATE:   08 / 2009   (AGE CHECK)</text>
  <rect x="34" y="186" width="315" height="34" fill="#FFF4ED" stroke="#C2410C" stroke-width="1.5" />
  <text x="44" y="208" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">REFRIGERANT: HCFC-22 / R-22</text>
  <text x="38" y="242" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">FACTORY CHG: 5 LBS 12 OZ</text>
  <text x="38" y="264" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">VOLTAGE:     208/230V · 1 PH · 60 HZ</text>
  <text x="38" y="290" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">R-22 uses mineral oil; R-410A/454B use POE oil</text>

  <!-- EPA Timeline Panel -->
  <rect x="380" y="54" width="416" height="252" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="380" y="54" width="416" height="30" fill="#1F2937" />
  <text x="394" y="74" fill="#FAF7F2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">VERIFIED U.S. EPA PHASE-OUT TIMELINE</text>

  <line x1="406" y1="106" x2="406" y2="278" stroke="#1F2937" stroke-width="2" />

  <rect x="398" y="106" width="16" height="16" fill="#1F2937" />
  <text x="426" y="116" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">JAN 1, 2010 — NEW R-22 EQUIPMENT BAN</text>
  <text x="426" y="134" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Clean Air Act banned manufacturing/importing new R-22 units.</text>

  <rect x="398" y="160" width="16" height="16" fill="#C2410C" />
  <text x="426" y="170" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">JAN 1, 2020 — R-22 PRODUCTION &amp; IMPORT BAN</text>
  <text x="426" y="188" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Zero virgin R-22 allowed. Service relies on reclaimed R-22 only.</text>

  <rect x="398" y="214" width="16" height="16" fill="#166534" />
  <text x="426" y="224" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">AIM ACT PHASEDOWN — R-410A -&gt; R-454B / R-32</text>
  <text x="426" y="242" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">HFC phasedown shifts new residential equipment to A2L fluids;</text>
  <text x="426" y="259" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">existing R-410A systems remain serviceable without panic replacement.</text>
  <text x="426" y="286" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">RULE: AGE &gt; 12 + R-22 = HARD FLAG FIRED (CHECK C)</text>
</svg>
