<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="fig02-title fig02-desc">
  <title id="fig02-title">Figure 02: Split-System Replacement Scope and Commonly Omitted Quote Items</title>
  <desc id="fig02-desc">Technical schematic mapping five frequently omitted HVAC quote items between indoor air handler and outdoor condenser: municipal permits, EPA 608 recovery, copper line set, thermostat wiring, and plenum ductwork transitions.</desc>
  <rect width="820" height="340" fill="#FAF7F2" stroke="#1F2937" stroke-width="2" />
  <rect x="0" y="0" width="820" height="34" fill="#1F2937" />
  <text x="16" y="22" fill="#FAF7F2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">FIG 02 · SPLIT-SYSTEM INSTALLATION SCOPE &amp; 5 OMITTED ITEMS</text>
  <text x="804" y="22" fill="#C2410C" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">QUOTE AUDIT</text>

  <!-- Indoor Air Handler / Coil Box -->
  <rect x="28" y="64" width="210" height="190" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="28" y="64" width="210" height="28" fill="#F2ECE1" stroke="#1F2937" stroke-width="1.5" />
  <text x="40" y="83" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">INDOOR UNIT / COIL</text>
  <text x="40" y="114" fill="#1F2937" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Supply / Return Plenum</text>
  <text x="40" y="132" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Sheet-metal transitions &amp;</text>
  <text x="40" y="148" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">4-in media filter rack (+$400)</text>
  <line x1="40" y1="164" x2="226" y2="164" stroke="#D5CFC2" stroke-width="1" />
  <text x="40" y="186" fill="#C2410C" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. AHRI Coil Model Match</text>
  <text x="40" y="205" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Must pair with condenser for</text>
  <text x="40" y="222" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">DOE 10 CFR 430.32 SEER2</text>
  <text x="40" y="242" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">+ FLOAT SAFETY SWITCH</text>

  <!-- Line Set & Low Voltage Between -->
  <line x1="238" y1="125" x2="555" y2="125" stroke="#C2410C" stroke-width="3" />
  <line x1="238" y1="137" x2="555" y2="137" stroke="#1F2937" stroke-width="2" />
  <rect x="275" y="76" width="244" height="78" fill="#FFF4ED" stroke="#C2410C" stroke-width="1.5" />
  <text x="287" y="96" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">OMISSION #3 · COPPER LINE SET</text>
  <text x="287" y="115" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Mineral oil (R-22) vs. POE (R-410A/454B)</text>
  <text x="287" y="133" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">New insulated lines: ~$750 typical add-on</text>
  <text x="287" y="147" fill="#4B5563" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">FLUSH PROTOCOL REQUIRED IF BURIED</text>

  <!-- Thermostat Line -->
  <line x1="238" y1="215" x2="555" y2="215" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="275" y="176" width="244" height="68" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5" />
  <text x="287" y="196" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">OMISSION #4 · THERMOSTAT &amp; WIRE</text>
  <text x="287" y="215" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Heat pumps / 2-stage need 5–8 conductors</text>
  <text x="287" y="232" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Include model &amp; 18/8 cable swap in writing</text>

  <!-- Outdoor Condenser Box -->
  <rect x="555" y="64" width="237" height="190" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="555" y="64" width="237" height="28" fill="#F2ECE1" stroke="#1F2937" stroke-width="1.5" />
  <text x="567" y="83" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">OUTDOOR CONDENSER</text>
  <text x="567" y="114" fill="#1F2937" font-family="system-ui, sans-serif" font-size="13" font-weight="700">EPA Section 608 Recovery</text>
  <text x="567" y="132" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">Omission #2: Legal refrigerant</text>
  <text x="567" y="148" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">recovery &amp; old unit haul-away</text>
  <line x1="567" y1="164" x2="780" y2="164" stroke="#D5CFC2" stroke-width="1" />
  <text x="567" y="186" fill="#C2410C" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Disconnect Whip &amp; Pad</text>
  <text x="567" y="205" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">240V fused disconnect, whip,</text>
  <text x="567" y="222" fill="#4B5563" font-family="system-ui, sans-serif" font-size="12">and leveled composite pad (+$300)</text>
  <text x="567" y="242" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">NITROGEN BRAZE + VACUUM</text>

  <!-- Bottom Bar: Permit & Bid Math -->
  <rect x="28" y="268" width="764" height="54" fill="#F2ECE1" stroke="#1F2937" stroke-width="1.5" />
  <text x="42" y="290" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">OMISSION #1 · MUNICIPAL PERMITS ($250+)   |   WORKED MATH: $7,900 QUICK BID + $1,700 MISSED ITEMS = $9,600 REAL COST</text>
  <text x="42" y="309" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Itemized $9,400 bid with permits, line set, AHRI certificate, and 2-yr labor warranty beats a stripped-down $7,900 quote by $200.</text>
</svg>
