<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="fig05-title fig05-desc">
  <title id="fig05-title">Figure 05: DOE 10 CFR 430.32 Regional SEER2 Minimums and Cooling Cost Comparison</title>
  <desc id="fig05-desc">Diagram showing DOE regional minimum efficiency standards (13.4 SEER2 North, 14.3/13.8 SEER2 SE/SW, 14.3 SEER2/7.5 HSPF2 Heat Pumps, 15.2 SEER2 ENERGY STAR) and annual electric cooling bill difference between mild Northern and hot Southern climates.</desc>
  <rect width="820" height="330" fill="#FAF7F2" stroke="#1F2937" stroke-width="2" />
  <rect x="0" y="0" width="820" height="34" fill="#1F2937" />
  <text x="16" y="22" fill="#FAF7F2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">FIG 05 · DOE 10 CFR 430.32 SEER2 MINIMUMS &amp; KWH SAVINGS MATH</text>
  <text x="804" y="22" fill="#C2410C" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">EFFECTIVE JAN 1, 2023</text>

  <!-- Left Panel: Federal Minimum Tiers -->
  <rect x="22" y="52" width="376" height="256" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="22" y="52" width="376" height="28" fill="#F2ECE1" stroke="#1F2937" stroke-width="1.5" />
  <text x="34" y="71" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">REGIONAL MINIMUMS (SEER2 ≈ SEER × 0.95)</text>

  <rect x="34" y="92" width="352" height="44" fill="#FAF7F2" stroke="#D5CFC2" stroke-width="1" />
  <text x="44" y="110" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">North Split Central AC</text>
  <text x="374" y="112" text-anchor="end" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700">13.4 SEER2</text>
  <text x="44" y="128" fill="#4B5563" font-family="system-ui, sans-serif" font-size="11">DOE 10 CFR 430.32 baseline tier</text>

  <rect x="34" y="144" width="352" height="48" fill="#FFF4ED" stroke="#C2410C" stroke-width="1.5" />
  <text x="44" y="162" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Southeast / Southwest Split AC</text>
  <text x="374" y="164" text-anchor="end" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">14.3 / 13.8 SEER2</text>
  <text x="44" y="182" fill="#4B5563" font-family="system-ui, sans-serif" font-size="11">14.3 under 45,000 Btu/h; 13.8 at or above 45,000 Btu/h</text>

  <rect x="34" y="200" width="352" height="44" fill="#FAF7F2" stroke="#D5CFC2" stroke-width="1" />
  <text x="44" y="218" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Nationwide Split Heat Pump</text>
  <text x="374" y="220" text-anchor="end" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">14.3 SEER2 / 7.5 HSPF2</text>
  <text x="44" y="236" fill="#4B5563" font-family="system-ui, sans-serif" font-size="11">DOE minimum all US regions</text>

  <rect x="34" y="252" width="352" height="44" fill="#ECFDF5" stroke="#166534" stroke-width="1.5" />
  <text x="44" y="270" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ENERGY STAR Heat Pump</text>
  <text x="374" y="272" text-anchor="end" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">15.2 SEER2 / 7.8 HSPF2</text>
  <text x="44" y="288" fill="#4B5563" font-family="system-ui, sans-serif" font-size="11">Common utility rebate threshold (verify on DSIRE)</text>

  <!-- Right Panel: 3-Ton Annual Cooling Cost Bars -->
  <rect x="418" y="52" width="380" height="256" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" />
  <rect x="418" y="52" width="380" height="28" fill="#1F2937" />
  <text x="430" y="71" fill="#FAF7F2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">ANNUAL 3-TON COOLING COST (10 -&gt; 14.3 -&gt; 18.0)</text>

  <!-- North Climate -->
  <text x="432" y="104" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Mild North (600 hrs, $0.16/kWh)</text>
  <rect x="432" y="114" width="110" height="18" fill="#4B5563" />
  <text x="550" y="127" fill="#1F2937" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">$346/yr @ 10 SEER2</text>
  <rect x="432" y="138" width="77" height="18" fill="#C2410C" />
  <text x="517" y="151" fill="#C2410C" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">$242/yr @ 14.3 (-$104)</text>
  <rect x="432" y="162" width="61" height="18" fill="#166534" />
  <text x="501" y="175" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">$192/yr @ 18.0 (extra -$50)</text>

  <line x1="432" y1="194" x2="782" y2="194" stroke="#D5CFC2" stroke-width="1" />

  <!-- South Climate -->
  <text x="432" y="214" fill="#1F2937" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Hot South (1,800 hrs, $0.15/kWh)</text>
  <rect x="432" y="224" width="308" height="18" fill="#4B5563" />
  <text x="440" y="237" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">$972/yr @ 10 SEER2</text>
  <rect x="432" y="248" width="215" height="18" fill="#C2410C" />
  <text x="440" y="261" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">$680/yr @ 14.3 (-$292/yr)</text>
  <rect x="432" y="272" width="171" height="18" fill="#166534" />
  <text x="611" y="285" fill="#166534" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">$540/yr @ 18.0 (-$140)</text>
</svg>
